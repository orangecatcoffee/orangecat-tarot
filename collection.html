<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>สมุดสะสมกาแฟแมวส้ม</title>
<link href="https://fonts.googleapis.com/css2?family=Mitr:wght@300;400;500;600&family=Playfair+Display:ital,wght@0,600;0,700;1,500&display=swap" rel="stylesheet">
<script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<style>
  :root{
    --cream:#F7EDE0; --cream-soft:#FBF5EB;
    --brown:#5A361B; --brown-dim:rgba(90,54,27,0.6); --brown-faint:rgba(90,54,27,0.35);
    --orange:#E8621A; --gold:#C9A44A;
  }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{height:100%;}
  body{
    background:
      radial-gradient(ellipse 120% 60% at 50% -10%, rgba(232,98,26,0.08), transparent 60%),
      radial-gradient(ellipse 90% 50% at 50% 110%, rgba(201,164,74,0.10), transparent 60%),
      var(--cream);
    font-family:'Mitr',sans-serif; color:var(--brown);
    min-height:100%; padding-bottom:48px;
  }

  .demo-banner{
    width:100%; background:rgba(232,98,26,0.10);
    border-bottom:1px solid rgba(232,98,26,0.3); color:#A84A14;
    font-size:11px; text-align:center; padding:8px 16px; display:none;
  }
  .demo-banner.show{ display:block; }

  .top{ text-align:center; padding:28px 20px 4px; }
  .eyebrow{
    display:inline-flex;align-items:center;gap:8px;
    font-size:10px;letter-spacing:3px;text-transform:uppercase;
    color:var(--orange);border:1px solid rgba(232,98,26,0.35);
    padding:5px 16px;border-radius:999px;margin-bottom:14px;
  }
  h1{
    font-family:'Playfair Display',serif; font-weight:700;
    font-size:clamp(20px,5.5vw,28px); letter-spacing:0.3px; color:var(--brown);
  }
  .sub{ font-size:12px;color:var(--brown-dim);margin-top:6px;font-weight:300; }

  .tabs{ display:flex;justify-content:center;gap:8px;margin-top:18px;padding:0 16px; }
  .tab-btn{
    font-family:'Mitr',sans-serif;font-size:13px;font-weight:400;
    color:var(--brown-dim);background:rgba(255,255,255,0.5);
    border:1px solid rgba(90,54,27,0.18);border-radius:999px;
    padding:9px 20px;cursor:pointer;
  }
  .tab-btn.active{
    color:#FFFFFF;background:linear-gradient(90deg,var(--orange),#F0894A);
    border-color:transparent;font-weight:500;
    box-shadow:0 3px 10px rgba(232,98,26,0.3);
  }

  .page{ max-width:480px;margin:0 auto;padding:20px 16px 0; display:none; }
  .page.active{ display:block; }

  /* ===== HISTORY FEED ===== */
  .history-item{
    display:flex; gap:12px; align-items:center;
    background:var(--cream-soft); border:1px solid rgba(90,54,27,0.1);
    border-radius:14px; padding:10px 14px; margin-bottom:10px;
  }
  .history-thumb{
    width:44px;height:44px;border-radius:10px;object-fit:cover;flex-shrink:0;
    background:rgba(90,54,27,0.08);
  }
  .history-thumb.placeholder{ display:flex;align-items:center;justify-content:center;font-size:18px; }
  .history-body{ flex:1;min-width:0; }
  .history-name{ font-size:14px;font-weight:500;color:var(--brown); }
  .history-date{ font-size:10.5px;color:var(--brown-dim);margin-top:2px;font-weight:300; }
  .history-tags{ display:flex;gap:5px;margin-top:5px;flex-wrap:wrap; }
  .history-tag{
    font-size:9.5px;padding:2px 8px;border-radius:999px;font-weight:400;
    background:rgba(232,98,26,0.1);color:var(--orange);border:1px solid rgba(232,98,26,0.25);
  }
  .history-tag.bean{ background:rgba(90,54,27,0.08);color:var(--brown-dim);border-color:rgba(90,54,27,0.15); }

  /* ===== SUMMARY SECTIONS ===== */
  .section{ margin-bottom:30px; }
  .section-head{ display:flex;align-items:baseline;justify-content:space-between;margin-bottom:12px; }
  .section-title{ font-family:'Playfair Display',serif;font-weight:700;font-size:17px;color:var(--brown); }
  .section-count{ font-size:12px;color:var(--orange);font-weight:500; }
  .section-track{ height:5px;border-radius:999px;background:rgba(90,54,27,0.08);overflow:hidden;margin-bottom:14px; }
  .section-fill{ height:100%;border-radius:999px;background:linear-gradient(90deg,var(--orange),var(--gold));transition:width .5s ease; }

  .grid{ display:grid;grid-template-columns:repeat(4,1fr);gap:9px; }
  .grid.wide{ grid-template-columns:repeat(2,1fr); }

  .gcard{
    aspect-ratio:0.75; border-radius:10px; overflow:hidden; position:relative;
    box-shadow:0 3px 8px rgba(90,54,27,0.15);
  }
  .gcard img{ width:100%;height:100%;object-fit:cover;display:block; }
  .gcard.locked{ opacity:0.32;filter:grayscale(1); box-shadow:none; }
  .gcard-label{
    position:absolute;left:0;right:0;bottom:0;padding:4px 5px 5px;
    background:linear-gradient(180deg,transparent,rgba(0,0,0,0.65));
    color:#fff;font-size:9px;font-weight:500;line-height:1.2;
  }

  .medal-card{
    aspect-ratio:0.85; border-radius:14px; display:flex;flex-direction:column;
    align-items:center;justify-content:center;text-align:center;padding:10px 8px;
    background:linear-gradient(160deg,#C9A44A,#8a6a2e); color:#FFF9EC;
    box-shadow:0 4px 12px rgba(201,164,74,0.35);
  }
  .medal-card.locked{
    background:rgba(90,54,27,0.06); color:var(--brown-faint);
    box-shadow:none; border:1px dashed rgba(90,54,27,0.2);
  }
  .medal-emoji{ font-size:26px;margin-bottom:6px; }
  .medal-title{ font-family:'Mitr',sans-serif;font-weight:500;font-size:11.5px;line-height:1.3; }
  .medal-dates{ font-size:8.5px;margin-top:5px;opacity:0.85;line-height:1.4; }

  .bean-gcard{
    aspect-ratio:0.85; border-radius:10px; display:flex;align-items:center;justify-content:center;
    text-align:center;padding:8px;font-family:'Playfair Display',serif;font-weight:700;font-size:11px;
    background:linear-gradient(160deg,#6B4226,#3D2510); color:#F7EDE0;
    box-shadow:0 3px 8px rgba(90,54,27,0.2);
  }
  .bean-gcard.locked{ background:rgba(90,54,27,0.06);color:var(--brown-faint);box-shadow:none;border:1px dashed rgba(90,54,27,0.2); }

  .empty-note{ text-align:center;color:var(--brown-dim);font-size:12px;padding:30px 20px;font-weight:300; }

  .status{ text-align:center;font-size:12px;color:var(--brown-dim);padding:20px 20px; }
  .foot{ text-align:center;font-size:10px;letter-spacing:2px; text-transform:uppercase;color:var(--brown-faint); margin-top:24px; }
</style>
</head>
<body>

<div class="demo-banner" id="demoBanner">⚠️ ยังไม่ได้ผูก LIFF ID จริง — แสดงตัวอย่างหน้าตาเฉยๆ ยังดึงของสะสมจริงไม่ได้</div>

<div class="top">
  <div class="eyebrow">🐱 กาแฟแมวส้ม</div>
  <h1>สมุดสะสมกาแฟแมวส้ม</h1>
  <div class="sub" id="subline">ของสะสมที่คุณได้จากทุกกิมมิกของร้าน</div>
</div>

<div class="tabs">
  <button class="tab-btn active" id="tabHistory" data-page="history">📖 ประวัติเครื่องดื่ม</button>
  <button class="tab-btn" id="tabSummary" data-page="summary">🏆 สรุปการสะสม</button>
</div>

<div class="page active" id="pageHistory">
  <div id="historyList"></div>
</div>

<div class="page" id="pageSummary">
  <div class="section">
    <div class="section-head">
      <span class="section-title">☕ เมนูที่ลองแล้ว</span>
      <span class="section-count" id="menuCount">0/0</span>
    </div>
    <div class="section-track"><div class="section-fill" id="menuFill"></div></div>
    <div class="grid" id="menuGrid"></div>
  </div>

  <div class="section">
    <div class="section-head">
      <span class="section-title">🎮 Theme ที่ร่วมสนุก</span>
      <span class="section-count" id="themeCount">0/0</span>
    </div>
    <div class="section-track"><div class="section-fill" id="themeFill"></div></div>
    <div class="grid wide" id="themeGrid"></div>
  </div>

  <div class="section">
    <div class="section-head">
      <span class="section-title">🌱 เมล็ดที่ลองแล้ว</span>
      <span class="section-count" id="beanCount">0/0</span>
    </div>
    <div class="section-track"><div class="section-fill" id="beanFill"></div></div>
    <div class="grid" id="beanGrid"></div>
  </div>
</div>

<div class="status" id="statusMsg" style="display:none;"></div>
<div class="foot">กาแฟแมวส้ม · Passport · build 2026-08-02-C (2-page static)</div>

<script>
const LIFF_ID = "2010600301-npcl3uPM";
const SUPABASE_URL = "https://nhzjnutvirjgiclkkfgx.supabase.co";
const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im5oempudXR2aXJqZ2ljbGtrZmd4Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODMxMjc3NjEsImV4cCI6MjA5ODcwMzc2MX0.Bv2zsjmo3yd9YpmfxUAmXf-aaFy7SbY77fmM_k4f7eg";
const DEMO_MODE = false;
const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

const demoBanner = document.getElementById('demoBanner');
const subline = document.getElementById('subline');
const statusMsg = document.getElementById('statusMsg');
if (DEMO_MODE) demoBanner.classList.add('show');

const THAI_MONTHS = ['ม.ค.','ก.พ.','มี.ค.','เม.ย.','พ.ค.','มิ.ย.','ก.ค.','ส.ค.','ก.ย.','ต.ค.','พ.ย.','ธ.ค.'];
function fmtDate(iso){
  const d = new Date(iso);
  return d.getDate() + ' ' + THAI_MONTHS[d.getMonth()] + ' ' + (d.getFullYear() + 543);
}

document.getElementById('tabHistory').addEventListener('click', () => switchPage('history'));
document.getElementById('tabSummary').addEventListener('click', () => switchPage('summary'));
function switchPage(page){
  document.getElementById('tabHistory').classList.toggle('active', page === 'history');
  document.getElementById('tabSummary').classList.toggle('active', page === 'summary');
  document.getElementById('pageHistory').classList.toggle('active', page === 'history');
  document.getElementById('pageSummary').classList.toggle('active', page === 'summary');
}

function renderHistory(rows, menuImageMap){
  const list = document.getElementById('historyList');
  list.innerHTML = '';
  if (!rows.length){
    list.innerHTML = '<div class="empty-note">ยังไม่มีประวัติการสั่ง<br>สั่งเครื่องดื่มแก้วแรกกันเลย!</div>';
    return;
  }
  rows.forEach(r => {
    const imgUrl = menuImageMap[r.menu_item_name];
    const item = document.createElement('div');
    item.className = 'history-item';
    const thumb = imgUrl
      ? `<img class="history-thumb" src="${imgUrl}" alt="">`
      : `<div class="history-thumb placeholder">☕</div>`;
    const tags = [];
    if (r.channel === 'liff-tarot') tags.push('<span class="history-tag">🎴 ไพ่ทาโร่</span>');
    if (r.bean_name) tags.push(`<span class="history-tag bean">🌱 ${r.bean_name}</span>`);
    item.innerHTML = `
      ${thumb}
      <div class="history-body">
        <div class="history-name">${r.menu_item_name}</div>
        <div class="history-date">${fmtDate(r.created_at)}</div>
        ${tags.length ? `<div class="history-tags">${tags.join('')}</div>` : ''}
      </div>
    `;
    list.appendChild(item);
  });
}

function renderMenuSection(unlockedNames, menuItems){
  const grid = document.getElementById('menuGrid');
  grid.innerHTML = '';
  const unlockedSet = new Set(unlockedNames);
  menuItems.forEach(m => {
    const unlocked = unlockedSet.has(m.name);
    const c = document.createElement('div');
    c.className = 'gcard' + (unlocked ? '' : ' locked');
    c.innerHTML = (unlocked && m.image_url)
      ? `<img src="${m.image_url}" alt="${m.name}"><div class="gcard-label">${m.name}</div>`
      : `<div class="gcard-label" style="position:static;background:none;padding:0;display:flex;align-items:center;justify-content:center;height:100%;color:var(--brown-faint);">?</div>`;
    grid.appendChild(c);
  });
  document.getElementById('menuCount').textContent = unlockedSet.size + '/' + menuItems.length;
  document.getElementById('menuFill').style.width = Math.round(unlockedSet.size / (menuItems.length || 1) * 100) + '%';
}

function renderThemeSection(unlockedNames, themePeriods){
  const grid = document.getElementById('themeGrid');
  grid.innerHTML = '';
  const unlockedSet = new Set(unlockedNames);
  themePeriods.forEach(t => {
    const unlocked = unlockedSet.has(t.theme_key);
    const dateRange = fmtDate(t.start_date) + ' – ' + (t.end_date ? fmtDate(t.end_date) : 'ปัจจุบัน');
    const c = document.createElement('div');
    c.className = 'medal-card' + (unlocked ? '' : ' locked');
    c.innerHTML = `
      <div class="medal-emoji">${unlocked ? '🏅' : '🔒'}</div>
      <div class="medal-title">${t.title}</div>
      <div class="medal-dates">${dateRange}</div>
    `;
    grid.appendChild(c);
  });
  document.getElementById('themeCount').textContent = unlockedSet.size + '/' + themePeriods.length;
  document.getElementById('themeFill').style.width = Math.round(unlockedSet.size / (themePeriods.length || 1) * 100) + '%';
}

function renderBeanSection(unlockedNames, beanUniverse){
  const grid = document.getElementById('beanGrid');
  grid.innerHTML = '';
  const unlockedSet = new Set(unlockedNames);
  beanUniverse.forEach(name => {
    const unlocked = unlockedSet.has(name);
    const c = document.createElement('div');
    c.className = 'bean-gcard' + (unlocked ? '' : ' locked');
    c.innerHTML = unlocked ? ('🌱 ' + name) : '?';
    grid.appendChild(c);
  });
  document.getElementById('beanCount').textContent = unlockedSet.size + '/' + beanUniverse.length;
  document.getElementById('beanFill').style.width = Math.round(unlockedSet.size / (beanUniverse.length || 1) * 100) + '%';
}

async function loadAll(lineUserId){
  const [menuRes, themeRes, beanUniverseRes, myCardsRes, historyRes] = await Promise.all([
    sb.from('menu_items').select('name, image_url').order('name'),
    sb.from('theme_periods').select('theme_key, title, start_date, end_date').order('start_date'),
    sb.from('customer_card_collection').select('card_name').eq('theme', 'bean'),
    sb.from('customer_card_collection').select('theme, card_name').eq('line_user_id', lineUserId),
    sb.from('preorders').select('menu_item_name, created_at, channel, bean_name').eq('line_user_id', lineUserId).order('created_at', { ascending: false }),
  ]);

  if (menuRes.error) throw menuRes.error;
  if (themeRes.error) throw themeRes.error;
  if (beanUniverseRes.error) throw beanUniverseRes.error;
  if (myCardsRes.error) throw myCardsRes.error;
  if (historyRes.error) throw historyRes.error;

  const menuItems = menuRes.data || [];
  const menuImageMap = {};
  menuItems.forEach(m => menuImageMap[m.name] = m.image_url);

  const themePeriods = themeRes.data || [];
  const beanUniverse = [...new Set((beanUniverseRes.data || []).map(r => r.card_name))].sort();

  const myCards = myCardsRes.data || [];
  const myMenu = myCards.filter(c => c.theme === 'menu').map(c => c.card_name);
  const myTheme = myCards.filter(c => c.theme === 'participation').map(c => c.card_name);
  const myBean = myCards.filter(c => c.theme === 'bean').map(c => c.card_name);

  renderHistory(historyRes.data || [], menuImageMap);
  renderMenuSection(myMenu, menuItems);
  renderThemeSection(myTheme, themePeriods);
  renderBeanSection(myBean, beanUniverse);
}

async function init(){
  if (DEMO_MODE){
    await loadAll('demo-user');
    return;
  }
  try{
    await liff.init({ liffId: LIFF_ID });
    if (!liff.isLoggedIn()){ liff.login(); return; }
    const profile = await liff.getProfile();
    subline.textContent = 'ของสะสมของ ' + profile.displayName;
    await loadAll(profile.userId);
  }catch(e){
    console.error(e);
    statusMsg.style.display = 'block';
    statusMsg.textContent = 'โหลดสมุดสะสมไม่สำเร็จ ลองเปิดหน้านี้ใหม่อีกครั้ง';
  }
}

init();
</script>

</body>
</html>
